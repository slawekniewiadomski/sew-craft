<svg xmlns="http://www.w3.org/2000/svg" width="980" height="392" viewBox="0 0 980 392" role="img" aria-labelledby="title desc">
  <title id="title">Dimension pick feedback states</title>
  <desc id="desc">Three illustrative canvas states: a hovered point with a candidate ring, a first pick with a dashed ghost snapping to the second point, and a cut dimension first corner with a ghost to a same-piece corner.</desc>

  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="980" height="392" fill="#ffffff"/>

  <!-- Panel 1 -->
  <g transform="translate(16 16)">
    <rect width="300" height="360" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="16" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a">1 · Armed — hover a point</text>
    <rect x="16" y="40" width="268" height="266" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <rect x="16" y="40" width="268" height="266" rx="4" fill="url(#grid)"/>

    <!-- piece outline -->
    <rect x="70" y="80" width="160" height="150" fill="none" stroke="#0a0a0a" stroke-width="2" rx="2"/>

    <!-- points -->
    <circle cx="70" cy="80" r="4" fill="#0a0a0a"/>
    <circle cx="230" cy="80" r="4" fill="#0a0a0a"/>
    <circle cx="70" cy="230" r="4" fill="#0a0a0a"/>
    <circle cx="230" cy="230" r="4" fill="#0a0a0a"/>

    <!-- hover candidate on top-right point -->
    <circle cx="230" cy="80" r="12" fill="#16a34a" opacity="0.14"/>
    <circle cx="230" cy="80" r="8" fill="none" stroke="#16a34a" stroke-width="2"/>

    <!-- cursor -->
    <g transform="translate(238 88)">
      <path d="M 0 0 L 0 15 L 4.2 10.5 L 7.2 17 L 9.4 16 L 6.5 9.8 L 12 9.8 Z" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2" stroke-linejoin="round"/>
    </g>

    <rect x="16" y="318" width="268" height="28" rx="4" fill="#f5f5f5" stroke="#e5e5e5"/>
    <text x="150" y="336" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#737373">Pick a point or a line.</text>
  </g>

  <!-- Panel 2 -->
  <g transform="translate(340 16)">
    <rect width="300" height="360" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="16" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a">2 · First pick — ghost snaps</text>
    <rect x="16" y="40" width="268" height="266" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <rect x="16" y="40" width="268" height="266" rx="4" fill="url(#grid)"/>

    <rect x="70" y="80" width="160" height="150" fill="none" stroke="#0a0a0a" stroke-width="2" rx="2"/>

    <!-- dashed ghost from first pick to snapped second pick -->
    <line x1="70" y1="80" x2="230" y2="230" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.9"/>

    <!-- points -->
    <circle cx="70" cy="80" r="10" fill="none" stroke="#16a34a" stroke-width="3"/>
    <circle cx="70" cy="80" r="4.5" fill="#16a34a"/>
    <circle cx="230" cy="80" r="4" fill="#0a0a0a"/>
    <circle cx="70" cy="230" r="4" fill="#0a0a0a"/>

    <!-- snapped target -->
    <circle cx="230" cy="230" r="12" fill="#16a34a" opacity="0.14"/>
    <circle cx="230" cy="230" r="8" fill="none" stroke="#16a34a" stroke-width="2"/>
    <circle cx="230" cy="230" r="4.5" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>

    <rect x="16" y="318" width="268" height="28" rx="4" fill="#f5f5f5" stroke="#e5e5e5"/>
    <text x="150" y="336" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#737373">Pick the second anchor.</text>
  </g>

  <!-- Panel 3 -->
  <g transform="translate(664 16)">
    <rect width="300" height="360" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="16" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a">3 · Cut — first corner</text>
    <rect x="16" y="40" width="268" height="266" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
    <rect x="16" y="40" width="268" height="266" rx="4" fill="url(#grid)"/>

    <!-- stitch loop -->
    <rect x="70" y="80" width="160" height="150" fill="none" stroke="#0a0a0a" stroke-width="2" rx="2"/>
    <!-- cut loop -->
    <rect x="58" y="68" width="184" height="174" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" rx="3"/>

    <!-- resting cut-corner handles -->
    <circle cx="58" cy="68" r="3.5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" opacity="0.8"/>
    <circle cx="242" cy="68" r="3.5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" opacity="0.8"/>
    <circle cx="58" cy="242" r="3.5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" opacity="0.8"/>
    <circle cx="242" cy="242" r="3.5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" opacity="0.8"/>

    <!-- ghost between same-piece corners -->
    <line x1="58" y1="68" x2="242" y2="242" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.9"/>

    <!-- first corner -->
    <circle cx="58" cy="68" r="9" fill="#16a34a" opacity="0.16"/>
    <circle cx="58" cy="68" r="8" fill="none" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="58" cy="68" r="3.5" fill="#16a34a"/>

    <!-- target corner -->
    <circle cx="242" cy="242" r="9" fill="#16a34a" opacity="0.14"/>
    <circle cx="242" cy="242" r="6.5" fill="none" stroke="#16a34a" stroke-width="2"/>
    <circle cx="242" cy="242" r="3.5" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>

    <rect x="16" y="318" width="268" height="28" rx="4" fill="#f5f5f5" stroke="#e5e5e5"/>
    <text x="150" y="336" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#737373">Pick second corner of the same piece</text>
  </g>
</svg>
